name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: |
          if node -e "const p=require('./package.json');process.exit(p.scripts&&p.scripts.test?0:1)"; then
            npm test
          else
            echo "::notice::No 'test' script in package.json; skipping unit tests."
            echo "This is expected until the first test suite lands."
          fi

  build:
    name: Build assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # build.js shells out to `bun` for the Tailwind CLI step.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: node build.js

      - name: Verify go:embed prerequisites exist
        run: |
          # main.go (backend repo) embeds these paths. If the build stops
          # producing one of them, the backend's go vet / go build fails with
          # "pattern ...: no matching files found" — a confusing error that
          # points at Go rather than at the frontend build. Catch it here.
          missing=0
          for p in static/css/*.min.css static/css/tailwind.css \
                   static/js/*.min.js static/themes/*.min.css \
                   static/locales/*.min.json static/fonts static/webfonts; do
            if ! ls -d $p >/dev/null 2>&1; then
              echo "::error::go:embed prerequisite missing after build: $p"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "main.go embeds these paths, so the backend build will fail."
            echo "A common cause is a dependency upgrade that changed its file"
            echo "layout (e.g. Font Awesome dropping webfonts/). Check bun.lock."
            exit 1
          fi
          echo "All go:embed prerequisites are present."

      - name: Verify templates reference only produced assets
        run: node scripts/check-assets.js

  locales:
    name: Locale parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check every locale matches en.json and is sorted
        run: node scripts/check-locales.js
